# Self-contained full stack: FastAPI API + PostGIS database.
#
# Runs the same way locally and on the EC2 host:
#   docker compose up -d --build
#
# The API is published on host port 80 (-> container 8000), so the app is
# reachable at http://<host>/ and the docs at http://<host>/docs.
# Configuration values (${...}) are read from the .env file next to this file.

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ${COMPOSE_PROJECT_NAME:-postgis_poc}_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    container_name: ${COMPOSE_PROJECT_NAME:-postgis_poc}_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV_STATE: global
      # The API talks to the database over the compose network, so the host is
      # the service name "db" (not localhost).
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-*}
    ports:
      - "80:8000"

volumes:
  postgres_data:
